<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Page Not Found — Aryon Private</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#0d0d0d;color:#fff;font-family:'Jost',system-ui,sans-serif;font-weight:300;}
a{color:inherit;text-decoration:none;}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px clamp(24px,5vw,80px);}
.eyebrow{font-size:10px;font-weight:500;letter-spacing:0.32em;text-transform:uppercase;color:#c9a96e;margin-bottom:32px;}
.num{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:clamp(100px,20vw,180px);color:rgba(201,169,110,0.08);line-height:1;margin-bottom:0;display:block;}
.rule{width:40px;height:1px;background:#c9a96e;margin:24px auto;}
.headline{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:clamp(24px,4vw,40px);color:#fff;letter-spacing:0.02em;margin-bottom:16px;}
.sub{font-size:15px;color:rgba(255,255,255,0.55);line-height:1.8;max-width:400px;margin:0 auto 48px;}
.btn{display:inline-block;background:#c9a96e;color:#0a0a0a;font-family:'Jost',sans-serif;font-weight:500;font-size:11px;letter-spacing:0.28em;text-transform:uppercase;padding:18px 40px;transition:background 0.3s;}
.btn:hover{background:#dbbe8a;}
.email{display:block;margin-top:24px;font-size:13px;color:rgba(201,169,110,0.7);letter-spacing:0.04em;transition:color 0.3s;}
.email:hover{color:#c9a96e;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Aryon Private</div>
  <span class="num">404</span>
  <div class="rule"></div>
  <h1 class="headline">This page doesn't exist.</h1>
  <p class="sub">The address may have changed, or this page was never here. Let us take you somewhere more useful.</p>
  <a href="/" class="btn">Return Home</a>
  <a href="mailto:private@aryonprivate.com" class="email">private@aryonprivate.com</a>
</div>
</body>
</html>
